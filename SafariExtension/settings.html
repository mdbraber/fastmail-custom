<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fastmail Custom</title>
<style>
    :root { color-scheme: light dark; }

    body {
        margin: 0;
        padding: 18px;
        min-width: 260px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    }

    h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }

    p { margin: 0 0 14px; opacity: 0.7; }

    button { font: inherit; padding: 5px 12px; }

    button[disabled] { opacity: 0.5; }

    a { color: inherit; }
</style>
</head>
<body>
    <h1>Fastmail Custom</h1>
    <div id="fastmail" hidden>
        <p id="note">The settings live in the Fastmail page, beside Fastmail&rsquo;s own.</p>
        <button id="open" type="button">Open settings</button>
    </div>
    <div id="elsewhere" hidden>
        <p>Fastmail Custom only runs on Fastmail. Open a Fastmail tab to change its
        settings, or <a id="permissions" href="#">manage website permissions</a>
        if Safari keeps asking for access here.</p>
    </div>
    <script src="settings.js"></script>
</body>
</html>
