name: FastmailShell
options:
  bundleIdPrefix: com.mdbraber.fastmail
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  FastmailShellKit:
    path: Packages/FastmailShellKit

targetTemplates:
  ShellApp:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": Settings.bundle
    postBuildScripts:
      - name: Copy User Script
        script: '"$SRCROOT/tools/copy-userscript.sh"'
        inputFiles:
          - $(USERSCRIPT_PATH)
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/userscript.js

targets:
  Personal:
    templates: [ShellApp]
    sources:
      - path: Apps/Personal
      - path: Apps/Shared
    dependencies:
      - target: PersonalShare
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.personal
        PRODUCT_NAME: mdbraber.com
        INFOPLIST_FILE: Apps/Personal/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Apps/Personal/iOS.entitlements

  Work:
    templates: [ShellApp]
    sources:
      - path: Apps/Work
      - path: Apps/Shared
    dependencies:
      - target: WorkShare
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.work
        PRODUCT_NAME: nexthealth.nl
        INFOPLIST_FILE: Apps/Work/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Apps/Work/iOS.entitlements

  # The mailto chooser: iPhone only, no web view, no account of its own. It
  # asks which shell a mailto belongs to and hands the link over. iOS gives
  # mailto links to the default mail app and to nothing else, so until Apple
  # grants the Default Mail App capability this is reached by its own scheme.
  Mailto:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Apps/Mailto
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.mailto
        PRODUCT_NAME: Mailto
        INFOPLIST_FILE: Apps/Mailto/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PersonalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/PersonalShare
      - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.personal.share
        PRODUCT_NAME: PersonalShare
        INFOPLIST_FILE: Extensions/PersonalShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  WorkShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/WorkShare
      - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.work.share
        PRODUCT_NAME: WorkShare
        INFOPLIST_FILE: Extensions/WorkShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IntegrationTests
      - path: Packages/FastmailShellKit/Sources/FastmailShellKit/Resources/harness.js
        buildPhase: resources
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

aggregateTargets:
  All:
    targets:
      - Personal
      - Work
      - Mailto

schemes:
  Personal:
    build:
      targets:
        Personal: all
    run:
      config: Debug
  Work:
    build:
      targets:
        Work: all
    run:
      config: Debug
  All:
    build:
      targets:
        All: all
  IntegrationTests:
    build:
      targets:
        IntegrationTests: [test]
    test:
      targets:
        - IntegrationTests
