name: FastmailShell
options:
  bundleIdPrefix: com.mdbraber.fastmail
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  FastmailShellKit:
    path: Packages/FastmailShellKit

targetTemplates:
  ShellApp:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": Settings.bundle
    postBuildScripts:
      - name: Copy User Script
        script: '"$SRCROOT/tools/copy-userscript.sh"'
        inputFiles:
          - $(USERSCRIPT_PATH)
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/userscript.js

targets:
  Personal:
    templates: [ShellApp]
    sources:
      - path: Apps/Personal
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.personal
        PRODUCT_NAME: mdbraber.com
        INFOPLIST_FILE: Apps/Personal/Info.plist

  Work:
    templates: [ShellApp]
    sources:
      - path: Apps/Work
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail.work
        PRODUCT_NAME: nexthealth.nl
        INFOPLIST_FILE: Apps/Work/Info.plist

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IntegrationTests
      - path: Packages/FastmailShellKit/Sources/FastmailShellKit/Resources/harness.js
        buildPhase: resources
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

aggregateTargets:
  All:
    targets:
      - Personal
      - Work

schemes:
  Personal:
    build:
      targets:
        Personal: all
    run:
      config: Debug
  Work:
    build:
      targets:
        Work: all
    run:
      config: Debug
  All:
    build:
      targets:
        All: all
  IntegrationTests:
    build:
      targets:
        IntegrationTests: [test]
    test:
      targets:
        - IntegrationTests
