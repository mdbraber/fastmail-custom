name: FastmailShell
options:
  bundleIdPrefix: com.mdbraber.fastmail-custom
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  FastmailShellKit:
    path: Packages/FastmailShellKit

targetTemplates:
  ShellApp:
    type: application
    supportedDestinations: [iOS, macOS]
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
    postBuildScripts:
      - name: Copy User Script
        script: '"$SRCROOT/tools/copy-userscript.sh"'
        inputFiles:
          - $(USERSCRIPT_PATH)
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/userscript.js

targets:
  Personal:
    templates: [ShellApp]
    sources:
      - path: Apps/Personal
      - path: Apps/Shared
    dependencies:
      - target: PersonalShare
        embed: true
        destinationFilters: [iOS]
      - target: PersonalShareMac
        embed: true
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.personal
        PRODUCT_NAME: mdbraber.com
        INFOPLIST_FILE: Apps/Personal/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Apps/Personal/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Apps/Personal/macOS.entitlements

  Work:
    templates: [ShellApp]
    sources:
      - path: Apps/Work
      - path: Apps/Shared
    dependencies:
      - target: WorkShare
        embed: true
        destinationFilters: [iOS]
      - target: WorkShareMac
        embed: true
        destinationFilters: [macOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.work
        PRODUCT_NAME: nexthealth.nl
        INFOPLIST_FILE: Apps/Work/Info.plist
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Apps/Work/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Apps/Work/macOS.entitlements

  # The mailto chooser: iPhone only, no web view, no account of its own. It
  # asks which shell a mailto belongs to and hands the link over. iOS gives
  # mailto links to the default mail app and to nothing else, so until Apple
  # grants the Default Mail App capability this is reached by its own scheme.
  Mailto:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: Apps/Mailto
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.mailto
        PRODUCT_NAME: Mailto
        INFOPLIST_FILE: Apps/Mailto/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  PersonalShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/PersonalShare
      - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.personal.share
        PRODUCT_NAME: PersonalShare
        INFOPLIST_FILE: Extensions/PersonalShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  WorkShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/WorkShare
      - path: Extensions/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.work.share
        PRODUCT_NAME: WorkShare
        INFOPLIST_FILE: Extensions/WorkShare/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  # The Mac's share menu: what was shared becomes a new message in the app
  # the extension sits in. SharedPayload is compiled in as a file, not through
  # the package, which links far more than an extension may use.
  PersonalShareMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/PersonalShareMac
      - path: Extensions/SharedMac
      - path: Packages/FastmailShellKit/Sources/FastmailShellKit/SharedPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.personal.share-mac
        PRODUCT_NAME: PersonalShareMac
        INFOPLIST_FILE: Extensions/PersonalShareMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/SharedMac/ShareMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  WorkShareMac:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/WorkShareMac
      - path: Extensions/SharedMac
      - path: Packages/FastmailShellKit/Sources/FastmailShellKit/SharedPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdbraber.fastmail-custom.work.share-mac
        PRODUCT_NAME: WorkShareMac
        INFOPLIST_FILE: Extensions/WorkShareMac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/SharedMac/ShareMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/IntegrationTests
      - path: Packages/FastmailShellKit/Sources/FastmailShellKit/Resources/harness.js
        buildPhase: resources
    dependencies:
      - package: FastmailShellKit
        product: FastmailShellKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

aggregateTargets:
  All:
    targets:
      - Personal
      - Work
      - Mailto

# After every build, from Xcode or xcodebuild, the build folder's copy is
# unregistered again, so Shortcuts, AppleScript and links keep reaching the app
# in /Applications. tools/claim-installed-apps.sh says why.
schemes:
  Personal:
    build:
      targets:
        Personal: all
      postActions:
        - name: Leave the app in /Applications the registered one
          settingsTarget: Personal
          script: '"$SRCROOT/tools/claim-installed-apps.sh"'
    run:
      config: Debug
  Work:
    build:
      targets:
        Work: all
      postActions:
        - name: Leave the app in /Applications the registered one
          settingsTarget: Work
          script: '"$SRCROOT/tools/claim-installed-apps.sh"'
    run:
      config: Debug
  All:
    build:
      targets:
        All: all
  IntegrationTests:
    build:
      targets:
        IntegrationTests: [test]
    test:
      targets:
        - IntegrationTests
